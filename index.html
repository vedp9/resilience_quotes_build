<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="./fire_favicon.png">
    <link rel="shortcut icon" href="./fire_favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="./fire_favicon.png">
    <meta property="og:image" content="./fire_favicon.png">
    <meta name="twitter:image" content="./fire_favicon.png">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yourdomain.com/">
    <meta property="og:title" content="Anyone Can't Hurt Me — Relentless Mindset & Resilience Engine">
    <meta property="og:description"
        content="Build unshakable mental toughness with curated wisdom, daily actionable habits, and immersive card-swiping mechanics.">
    <meta property="og:image" content="https://yourdomain.com/fire_favicon.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Anyone Can't Hurt Me Preview Banner">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://yourdomain.com/">
    <meta name="twitter:title" content="Anyone Can't Hurt Me — Relentless Mindset & Resilience Engine">
    <meta name="twitter:description"
        content="Build unshakable mental toughness with curated wisdom, daily actionable habits, and immersive card-swiping mechanics.">
    <meta name="twitter:image" content="https://yourdomain.com/fire_favicon.png">
    <meta property="og:image" content="./og-preview.png">
    <meta name="twitter:image" content="./og-preview.png">
    <title>Resilience — Daily Mental Toughness Quotes</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            corePlugins: { preflight: true },
            theme: {
                extend: {
                    colors: {
                        background: '#0c0c0e',
                        card: '#161618',
                        textPrimary: '#ffffff',
                        textSecondary: '#a1a1a6'
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'SF Pro Text', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body
    class="bg-background text-textPrimary font-sans antialiased overflow-hidden lg:overflow-auto lg:min-h-screen selection:bg-gray-700">

    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 z-40 bg-background/80 backdrop-blur-md border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="text-xl font-bold tracking-tight">RESILIENCE</h1>
            <div class="flex items-center gap-3">
                <button id="openAddQuoteBtn"
                    class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/10 transition-colors text-sm font-medium border border-white/10">
                    <i data-lucide="plus" class="w-4 h-4 text-white"></i>
                    <span class="hidden sm:inline">Add Quote</span>
                </button>
                <button id="openBookmarksBtn"
                    class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/10 transition-colors text-sm font-medium border border-white/10"
                    aria-label="View saved quotes">
                    <i data-lucide="heart" class="w-4 h-4 text-red-500 fill-current" aria-hidden="true"></i>
                    <span class="sr-only">Saved quotes: </span>
                    <span id="bookmarkCount" class="font-bold">0</span>
                </button>
            </div>
        </div>

        <!-- Category Filter Pills -->
        <div class="w-full overflow-x-auto no-scrollbar border-b border-white/5 pb-2 pt-1 px-4">
            <div class="flex gap-2 min-w-max mx-auto max-w-7xl" id="categoryFilters">
                <!-- Pills injected via JS -->
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main id="quotesContainer"
        class="mobile-snap-container pt-[120px] lg:pt-32 pb-safe lg:pb-8 max-w-7xl mx-auto w-full h-[100dvh] lg:h-auto lg:overflow-visible">
        <!-- Quotes will be injected here -->
    </main>

    <!-- Floating Navigation Arrows (Mobile Only) -->
    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 lg:hidden flex flex-col items-center gap-4 z-30 w-full max-w-sm px-6 transition-opacity duration-300"
        id="navArrowsContainer">
        
        <div class="flex justify-between w-full pointer-events-none">
            <button id="navLeftBtn"
                class="pointer-events-auto p-4 rounded-full bg-white/10 backdrop-blur-md border border-white/10 active:scale-95 transition-all text-white shadow-xl flex items-center justify-center"
                aria-label="Previous quote">
                <i data-lucide="arrow-left" class="w-6 h-6"></i>
            </button>
            <button id="navRightBtn"
                class="pointer-events-auto p-4 rounded-full bg-white/10 backdrop-blur-md border border-white/10 active:scale-95 transition-all text-white shadow-xl flex items-center justify-center"
                aria-label="Next quote">
                <i data-lucide="arrow-right" class="w-6 h-6"></i>
            </button>
        </div>
        
        <p class="text-[11px] text-white/50 tracking-wider font-medium pointer-events-none text-center">
            Swipe left or right to browse
        </p>
    </div>

    <!-- Add Quote Modal Overlay -->
    <div id="addQuoteModal"
        class="fixed inset-0 z-50 bg-background/90 backdrop-blur-xl hidden opacity-0 transition-opacity duration-300 flex flex-col items-center justify-center p-4">
        <div
            class="bg-card border border-white/10 rounded-2xl w-full max-w-lg overflow-hidden flex flex-col shadow-2xl mt-safe">
            <div class="flex items-center justify-between p-4 border-b border-white/10">
                <h2 class="text-xl font-bold">Personalize</h2>
                <button id="closeAddQuoteBtn" class="p-2 rounded-full bg-white/5 hover:bg-white/10 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="addQuoteForm" class="p-6 space-y-4 flex-1 overflow-y-auto max-h-[70vh]">
                <div>
                    <label for="customQuoteText" class="block text-sm font-medium text-textSecondary mb-1">Quote Text *</label>
                    <textarea id="customQuoteText" required rows="3"
                        class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-white/30 resize-none"
                        placeholder="Enter the inspiring quote..."></textarea>
                </div>
                <div>
                    <label for="customQuoteAuthor" class="block text-sm font-medium text-textSecondary mb-1">Author & Source *</label>
                    <input type="text" id="customQuoteAuthor" required
                        class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-white/30"
                        placeholder="e.g., David Goggins — Can't Hurt Me">
                </div>
                <div>
                    <label for="customQuoteCategory" class="block text-sm font-medium text-textSecondary mb-1">Category *</label>
                    <select id="customQuoteCategory" required
                        class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-white/30 appearance-none">
                        <option value="Mental Toughness" class="bg-card text-white">Mental Toughness</option>
                        <option value="Compounding & Growth" class="bg-card text-white">Compounding & Growth</option>
                        <option value="Precision Communication" class="bg-card text-white">Precision Communication
                        </option>
                        <option value="Strategic Thinking" class="bg-card text-white">Strategic Thinking</option>
                    </select>
                </div>
                <div>
                    <label for="customQuoteInsight" class="block text-sm font-medium text-textSecondary mb-1">Actionable Insight
                        (Optional)</label>
                    <textarea id="customQuoteInsight" rows="2"
                        class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-white/30 resize-none"
                        placeholder="What daily habit or action will you take from this?"></textarea>
                </div>
                <div class="pt-4 flex gap-3">
                    <button type="button" id="cancelAddQuoteBtn"
                        class="flex-1 py-3 rounded-xl bg-white/5 hover:bg-white/10 transition-colors font-medium">Cancel</button>
                    <button type="submit"
                        class="flex-1 py-3 rounded-xl bg-white text-black hover:bg-gray-200 transition-colors font-bold">Save
                        Quote</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bookmarks Modal Overlay -->
    <div id="bookmarksModal"
        class="fixed inset-0 z-50 bg-background/90 backdrop-blur-xl hidden opacity-0 transition-opacity duration-300 flex flex-col">
        <div class="flex items-center justify-between p-4 border-b border-white/10 mt-safe">
            <h2 class="text-xl font-bold">Saved Insights</h2>
            <button id="closeBookmarksBtn" class="p-2 rounded-full bg-white/5 hover:bg-white/10 transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <div id="bookmarksList" class="flex-1 overflow-y-auto p-4 space-y-4 pb-safe">
            <!-- Bookmarked items injected here -->
        </div>
    </div>

    <!-- Splash Intro Screen -->
    <div id="splashScreen"
        class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-black transition-opacity duration-600">
        <div class="p-8 md:p-12 text-center transform scale-100 transition-transform duration-600" id="splashBox">
            <h1
                class="text-5xl md:text-7xl font-black tracking-tighter uppercase text-red-500 drop-shadow-[0_0_15px_rgba(220,38,38,0.8)] leading-none mb-4">
                ANYONE CAN'T<br>HURT ME
            </h1>
            <p class="text-white text-sm md:text-base font-bold tracking-widest uppercase">BUILDING RELENTLESS MENTAL
                TOUGHNESS</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="quotesData.js"></script>
    <script src="app.js"></script>
</body>

</html>
